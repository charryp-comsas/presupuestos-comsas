name: Sincronizar gastos (App) -> CONTROL DE COSTOS v2 - PLANTILLA.xlsm

on:
  schedule:
    - cron: "*/20 * * * *"   # cada 20 minutos, igual que sync-precios
  workflow_dispatch: {}       # permite correrlo a mano desde GitHub para probar

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests openpyxl

      - name: Ejecutar sincronizacion de gastos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          PRESUPUESTO_ID_ACTIVO: ${{ secrets.PRESUPUESTO_ID_ACTIVO }}
          ONEDRIVE_RUTA_ARCHIVO_COSTOS: "Escritorio/PRESUPUESTOS DE OBRA/07_Control de Costos/CONTROL DE COSTOS v2 - PLANTILLA.xlsm"
        run: python sync_gastos_onedrive.py

      # Mismo tema del refresh token que rota -- ver sync-precios.yml y
      # SETUP_SINCRONIZACION.md. Como ya tienes ese workflow corriendo,
      # el MS_REFRESH_TOKEN de ambos jobs puede desincronizarse entre si
      # si cada uno lo rota por su lado -- revisa el log de este job
      # cada tanto igual que el de precios.
